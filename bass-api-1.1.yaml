                  status: to do
                  creation_timestamp: 1141725100
                  category_id: 2
                  subcategory_id: 6
                  action_id: 16
                  body:
                    Название таблицы: slug1
                    Путь для выгрузки: C:/
                    СУБД: PostgreSQL
                    Фильтры/условия: slug2
                    Формат выгрузки: CSV
                  msg_ids: null
                - user_id: 1
                  ticket_id: 3
                  ticket_name: <set name2>
                  priority: low
                  status: cancelled
                  creation_timestamp: 1241725100
                  category_id: 2
                  subcategory_id: 6
                  action_id: 16
                  body:
                    Название таблицы: slug1
                    Путь для выгрузки: C:/
                    СУБД: PostgreSQL
                    Фильтры/условия: slug2
                    Формат выгрузки: CSV
                  msg_ids: null
                - user_id: 1
                  ticket_id: 4
                  ticket_name: <set name3>
                  priority: low
                  status: in progress
                  creation_timestamp: 1341725100
                  category_id: 1
                  subcategory_id: 2
                  action_id: 4
                  body:
                    Загрузить файл: CSV
                    Причина запроса: slug2
                    Требуемые изменения: slug1
                    Функция: Список функций
                  msg_ids: null
                - user_id: 1
                  ticket_id: 5
                  ticket_name: <set name3>
                  priority: low
                  status: on hold
                  creation_timestamp: 1441725100
                  category_id: 1
                  subcategory_id: 2
