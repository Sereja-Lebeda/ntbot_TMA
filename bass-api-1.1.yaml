                    Кто будет использовать: CSV
                    Описание запроса: slug1
                    Рабочее название: Список функций
                    Цель: slug2
                  msg_ids: null
                - user_id: 1
                  ticket_id: 6
                  ticket_name: <set name4>
                  priority: low
                  status: rejected
                  creation_timestamp: 1541725100
                  category_id: 3
                  subcategory_id: 9
                  action_id: 10
                  body:
                    ФИО сотрудника: Иванов Иван Иванович
                  msg_ids: null
                - user_id: 1
                  ticket_id: 7
                  ticket_name: <set name5>
                  priority: low
                  status: to do
                  creation_timestamp: 1641725100
                  category_id: 4
                  subcategory_id: 12
                  action_id: 32
                  body:
                    Для чего требуется: Иванов Иван Иванович
                    Количество: 67
                    Ссылка на товар: Ссылка на товар
                    Что требуется: Иванов Иван Иванович
                  msg_ids: null
                - user_id: 1
                  ticket_id: 8
                  ticket_name: <set name6>
                  priority: low
                  status: complete
                  creation_timestamp: 1741725100
                  category_id: 5
                  subcategory_id: 13
                  action_id: 37
                  body:
                    Как давно наблюдается: Несколько часов
                    Описание проблемы: '67'
                    Текст ошибки: Иванов Иван Иванович
                    Тип проблемы: Подключается, но нет доступа
                  msg_ids: null
