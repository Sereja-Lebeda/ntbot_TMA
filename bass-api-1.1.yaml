openapi: 3.0.0
info:
  title: BASS-API
  version: 1.0.0
  description: ''
servers:
  - url: '{{host}}'
paths:
  /:
    get:
      summary: index
      parameters:
        - name: Authorization
          in: header
          schema:
            type: integer
          example: 785
      responses:
        '200':
          description: '200'
          headers:
            Server:
              schema:
                type: string
              example: nginx/1.28.2
            Date:
              schema:
                type: string
              example: Fri, 23 Oct 2026 13:43:31 GMT
            Content-Length:
              schema:
                type: integer
              example: 16
            Connection:
              schema:
                type: string
              example: keep-alive
  /user:
    get:
      summary: User
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: ''
      responses:
        '200':
          description: '200'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:11:10 GMT
            Content-Length:
              schema:
                type: integer
              example: 83
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  tg_id:
                    type: integer
                  name:
                    type: string
                  role:
                    type: string
                  department:
                    type: string
                  local_ip:
                    type: string
                    format: ip-address
                  pc_name:
                    type: string
                  remote_access_timestamp:
                    type: integer
                  ticket_ids:
                    type: array
                    items:
                      type: integer
              example:
                id: 1
                tg_id: 234428660
                name: Лебедянский Сергей СвятойОтецович
                role: admin
                department: IT
                local_ip: 192.168.4.229
                pc_name: NewTech205
                remote_access_timestamp: 0
                ticket_ids:
                  - 2
                  - 3
                  - 4
                  - 5
                  - 6
                  - 7
                  - 8
        '401':
          description: '401'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:09:17 GMT
            Content-Length:
              schema:
                type: integer
              example: 48
  /ticket/{id}:
    get:
      summary: Ticket
      parameters:
        - name: Authorization
          in: header
          schema:
            type: integer
          example: 785
      responses:
        '200':
          description: '200'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:24:00 GMT
            Content-Length:
              schema:
                type: integer
              example: 436
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  ticket_id:
                    type: integer
                  ticket_name:
                    type: string
                  priority:
                    type: string
                  status:
                    type: string
                  creation_timestamp:
                    type: integer
                  category_id:
                    type: integer
                  subcategory_id:
                    type: integer
                  action_id:
                    type: integer
                  body:
                    type: object
                    properties:
                      Название таблицы:
                        type: string
                      Путь для выгрузки:
                        type: string
                        format: uri
                      СУБД:
                        type: string
                      Фильтры/условия:
                        type: string
                      Формат выгрузки:
                        type: string
                  msg_ids:
                    nullable: true
              example:
                user_id: 1
                ticket_id: 2
                ticket_name: <set name>
                priority: low
                status: to do
                creation_timestamp: 1141725100
                category_id: 2
                subcategory_id: 6
                action_id: 16
                body:
                  Название таблицы: slug1
                  Путь для выгрузки: C:/
                  СУБД: PostgreSQL
                  Фильтры/условия: slug2
                  Формат выгрузки: CSV
                msg_ids: null
        '404':
          description: 404 - not existing ticket
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:28:27 GMT
            Content-Length:
              schema:
                type: integer
              example: 46
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                404 - not existing ticket:
                  value:
                    error: >-
                      getting ticket from db - making get request to db - dbconn
                      returned error - getting ticket from db - not found
                404 - foreign ticket:
                  value:
                    error: getting ticket from db - not found
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 2
    put:
      summary: Ticket
      responses:
        '200':
          description: '200'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:31:56 GMT
            Content-Length:
              schema:
                type: integer
              example: 2
        '400':
          description: 400 - missing field
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:34:19 GMT
            Content-Length:
              schema:
                type: integer
              example: 127
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket_name:
                  type: string
                priority:
                  type: string
                body:
                  type: object
                  properties:
                    Название БД:
                      type: string
                    Обоснование запроса:
                      type: string
                    Описание проблемы:
                      type: string
                    Уровень доступа:
                      type: string
            example:
              ticket_name: Запрос доступа к БД
              priority: normal
              body:
                Название БД: PG
                Обоснование запроса: Горит
                Описание проблемы: Не работает
                Уровень доступа: Чтение
    delete:
      summary: Ticket
      parameters:
        - name: Authorization
          in: header
          schema:
            type: integer
          example: 785
      responses:
        '200':
          description: '200'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:37:36 GMT
            Content-Length:
              schema:
                type: integer
              example: 2
        '404':
          description: '404'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:38:02 GMT
            Content-Length:
              schema:
                type: integer
              example: 46
        '409':
          description: '409'
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:37:50 GMT
            Content-Length:
              schema:
                type: integer
              example: 31
        '500':
          description: 500 (404)
          headers:
            Date:
              schema:
                type: string
              example: Mon, 10 Aug 2026 09:38:19 GMT
            Content-Length:
              schema:
                type: integer
              example: 139
